# Works with `podman compose up` or `docker compose up`.
services:
  ollama:
    image: docker.io/ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
  opslens:
    build: { context: ., dockerfile: Containerfile }
    depends_on: [ollama]
    ports: ["8080:8080"]
    environment:
      OPSLENS_LLM_BASE_URL: http://ollama:11434/v1
      OPSLENS_LLM_MODEL: llama3.2:3b
volumes:
  ollama: {}
