name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests && ruff format --check src tests
      - name: Type check (mypy --strict)
        run: mypy src
      - name: Unit + integration tests (pytest, fake LLM, in-process MCP)
        run: pytest -q
      - name: Retrieval evaluation report
        run: |
          opslens ingest --no-embeddings
          opslens eval -k 3 | tee -a "$GITHUB_STEP_SUMMARY"
        env: { OPSLENS_RAG_MODE: bm25 }

  container:
    runs-on: ubuntu-latest
    needs: lint-test
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Build image with Podman
        run: podman build -t opslens:ci -f Containerfile .
      - name: Smoke test container
        run: |
          podman run -d --name opslens -p 8080:8080 opslens:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/readyz && break; sleep 1; done
          curl -fs localhost:8080/healthz
          curl -fs localhost:8080/v1/tools
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}:latest
          podman tag opslens:ci "$IMG" && podman push "$IMG"
